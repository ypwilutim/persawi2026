<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Media Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <nav class="bg-emerald-800 text-white px-6 py-4 shadow">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg" id="navTitle">Media Center</h1>
        <p class="text-xs text-emerald-200" id="userInfo">Memuat profil...</p>
      </div>
      <div class="flex gap-3 items-center">
        <a href="public.html" class="text-sm bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded-lg">Galeri Publik</a>
        <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Form Upload -->
    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
      <h2 class="font-bold text-lg text-slate-900 mb-4 border-b pb-2">Upload Dokumentasi</h2>
      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Unit / Kontingen</label>
          <input type="text" id="unit" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-sm font-medium text-slate-700">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Nama Petugas Media</label>
          <input type="text" id="uploader" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Kategori Momen</label>
          <select id="kategori" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
            <option value="Persiapan_Latihan">01. Persiapan & Latihan</option>
            <option value="Keberangkatan_Kedatangan">02. Perjalanan & Kedatangan</option>
            <option value="Mendirikan_Tenda">03. Mendirikan Tenda</option>
            <option value="Makan_Bersama">04. Makan Bersama</option>
            <option value="Kegiatan_Lomba">05. Kegiatan Utama & Lomba</option>
            <option value="Candid_Lainnya">06. Momen Candid / Lainnya</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Keterangan Singkat</label>
          <input type="text" id="keterangan" placeholder="Contoh: Suasana mendirikan tenda utama" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1" id="fileLabel">Pilih Foto / Video (Maks 38MB/file)</label>
          <input type="file" id="fileInput" accept="image/*,video/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
        </div>

        <button type="submit" id="btnUpload" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition shadow">
          Unggah ke Google Drive
        </button>
      </form>
    </div>

    <!-- Riwayat Upload Unit Ini -->
    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="font-bold text-lg text-slate-900">Riwayat Unggahan Unit Anda</h2>
        <button onclick="loadMyMedia()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded-md">Refresh Data</button>
      </div>
      
      <div id="mediaList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <p class="text-sm text-slate-500 col-span-2 text-center py-8">Memuat data...</p>
      </div>
    </div>

  </main>

  <script>
    const user = getStoredUser();
    if (!user || user.role !== 'media' || !getStoredToken()) {
      window.location.href = 'login.html';
    }

    let maxFileMB = 25;

    function logout() {
      clearSession();
      window.location.href = 'login.html';
    }

    function requireSession() {
      const current = getStoredUser();
      if (!current || !getStoredToken()) {
        clearSession();
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    loadSiteConfig().then(cfg => {
      document.getElementById('navTitle').textContent = `Media Center ${cfg.EVENT_NAME}`;
      maxFileMB = parseInt(cfg.MAX_FILE_MB) || 25;
      document.getElementById('fileLabel').textContent = `Pilih Foto / Video (Maks ${maxFileMB}MB/file)`;
    });

    document.getElementById('userInfo').textContent = `${user.unit} • ${user.nama}`;
    document.getElementById('unit').value = user.unit;
    document.getElementById('uploader').value = user.nama;

    document.getElementById('uploadForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const file = document.getElementById('fileInput').files[0];
      if (!file) return;

      if (file.size > maxFileMB * 1024 * 1024) {
        alert(`Ukuran file terlalu besar (Maksimal ${maxFileMB}MB per upload via web). Silakan kompres video terlebih dahulu.`);
        return;
      }

      const btn = document.getElementById('btnUpload');
      btn.disabled = true;
      btn.textContent = 'Mengunggah ke Drive... (Jangan tutup halaman)';

      const reader = new FileReader();
      reader.onload = async function() {
        const base64 = reader.result.split(',')[1];
        const cleanUnit = user.unit.replace(/\s+/g, '');
        const kategori = document.getElementById('kategori').value;
        const ext = file.name.split('.').pop();
        const customFilename = `${cleanUnit}_${kategori}_${Date.now()}.${ext}`;

        try {
          const result = await apiPost({
            action: 'upload',
            unit: user.unit,
            uploader: document.getElementById('uploader').value,
            kategori: kategori,
            keterangan: document.getElementById('keterangan').value,
            filename: customFilename,
            mimeType: file.type,
            base64: base64,
            token: getStoredToken()
          });
          if (result.status === 'success') {
            alert('File berhasil diunggah ke Google Drive!');
            document.getElementById('uploadForm').reset();
            document.getElementById('unit').value = user.unit;
            document.getElementById('uploader').value = user.nama;
            loadMyMedia();
          } else {
            alert('Gagal: ' + (result.message || 'Upload gagal'));
            if (/Sesi/.test(result.message || '')) requireSession();
          }
        } catch (err) {
          alert('Terjadi kesalahan jaringan saat mengunggah.');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Unggah ke Google Drive';
        }
      };
      reader.readAsDataURL(file);
    });

    async function loadMyMedia() {
      const container = document.getElementById('mediaList');
      container.innerHTML = '<p class="text-sm text-slate-500 col-span-2 text-center py-8">Memuat data...</p>';

      try {
        const result = await apiGet('getMedia');
        if (result.status !== 'success') throw new Error(result.message || 'Gagal memuat data');
        const myFiles = (result.data || []).filter(item => item.unit === user.unit);

        if (myFiles.length === 0) {
          container.innerHTML = '<p class="text-sm text-slate-500 col-span-2 text-center py-8">Belum ada dokumentasi yang diunggah oleh unit Anda.</p>';
          return;
        }

        container.innerHTML = myFiles.map(item => `
          <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start gap-2">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">${escapeHtml(item.kategori)}</span>
                <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded ${item.filetype === 'video' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">${escapeHtml(item.filetype)}</span>
              </div>
              <p class="font-semibold text-sm mt-2 text-slate-800 break-all">${escapeHtml(item.filename)}</p>
              <p class="text-xs text-slate-600 mt-1">${escapeHtml(item.keterangan)}</p>
            </div>
            <div class="mt-3 pt-2 border-t border-slate-200 flex justify-between items-center text-xs text-slate-500">
              <span>Oleh: ${escapeHtml(item.uploader)}</span>
              <a href="${escapeHtml(safeUrl(item.drive_url))}" target="_blank" rel="noopener" class="text-emerald-600 font-semibold hover:underline">Lihat di Drive ↗</a>
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<p class="text-sm text-red-500 col-span-2 text-center py-8">Gagal memuat data.</p>';
      }
    }

    loadMyMedia();
  </script>
</body>
</html>
