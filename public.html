<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Publik - Media Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js?v=20261112"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <header class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-slate-900">
    <div class="max-w-7xl mx-auto px-4 py-10 md:py-14">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
        <div>
          <span class="inline-block text-[11px] font-bold tracking-widest uppercase bg-amber-400 text-slate-900 px-3 py-1 rounded-full">Galeri Publik</span>
          <h1 class="text-3xl md:text-5xl font-bold mt-4 text-white" id="eventName">Media Center</h1>
          <p class="text-emerald-100 mt-2 text-sm md:text-base" id="eventSubtitle">Memuat informasi acara...</p>
          <p class="text-emerald-300/80 mt-1 text-xs md:text-sm italic" id="eventSlogan"></p>
        </div>
        <div class="flex flex-wrap gap-2">
          <a id="sessionLink" href="login.html" class="text-sm bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-2 rounded-lg font-medium">Masuk</a>
          <button onclick="loadMedia()" class="text-sm bg-emerald-500 hover:bg-emerald-400 text-slate-900 px-4 py-2 rounded-lg font-semibold">Refresh</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 md:py-8 space-y-6">

    <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Total File</p>
        <p class="text-2xl md:text-3xl font-bold mt-1" id="statTotal">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Foto</p>
        <p class="text-2xl md:text-3xl font-bold mt-1 text-sky-400" id="statFoto">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Video</p>
        <p class="text-2xl md:text-3xl font-bold mt-1 text-purple-400" id="statVideo">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Unit Sekolah</p>
        <p class="text-2xl md:text-3xl font-bold mt-1 text-amber-400" id="statUnit">0</p>
      </div>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 grid grid-cols-1 md:grid-cols-3 gap-3">
      <select id="filterUnit" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm">
        <option value="">Semua Unit Sekolah</option>
      </select>
      <select id="filterKategori" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm">
        <option value="">Semua Kategori</option>
      </select>
      <input id="searchInput" type="search" placeholder="Cari keterangan, file, atau pengunggah..." class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm">
    </section>

    <section>
      <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        <div class="col-span-full text-center py-16 text-slate-500 text-sm">Memuat galeri...</div>
      </div>
      <div id="emptyState" class="hidden text-center py-16">
        <p class="text-4xl mb-3">🖼️</p>
        <p class="text-slate-400 font-medium">Belum ada dokumentasi yang ditampilkan.</p>
      </div>
    </section>

  </main>

  <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
    Media Center <span id="footerEvent">PERSAWI 2026</span> &middot; YPWI Luwu Timur
  </footer>

  <div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/95 p-4 md:p-8">
    <div class="max-w-6xl mx-auto h-full flex flex-col">
      <div class="flex items-start justify-between gap-4 pb-3">
        <div class="min-w-0">
          <h3 class="font-semibold text-white truncate" id="lightboxTitle"></h3>
          <p class="text-xs text-slate-400 mt-1" id="lightboxMeta"></p>
        </div>
        <button data-close-lightbox class="shrink-0 w-9 h-9 rounded-lg bg-white/10 hover:bg-white/20 text-white text-lg leading-none">&times;</button>
      </div>
      <div id="lightboxContent" class="flex-1 min-h-0 flex items-center justify-center"></div>
      <div id="lightboxThumbs" class="flex gap-2 overflow-x-auto py-3"></div>
      <div class="flex items-center justify-between gap-3 pb-1 text-xs text-slate-300">
        <button type="button" data-lightbox-prev class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20">‹ Sebelumnya</button>
        <span id="lightboxCounter" class="text-slate-400"></span>
        <button type="button" data-lightbox-next class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20">Berikutnya ›</button>
      </div>
    </div>
  </div>

  <script>
    const KATEGORI_LABEL = {
      Persiapan_Latihan: 'Persiapan & Latihan',
      Keberangkatan_Kedatangan: 'Perjalanan & Kedatangan',
      Mendirikan_Tenda: 'Mendirikan Tenda',
      Makan_Bersama: 'Makan Bersama',
      Kegiatan_Lomba: 'Kegiatan Utama & Lomba',
      Candid_Lainnya: 'Candid / Lainnya'
    };

    let allMedia = [];
    let currentAlbum = { id: '', items: [], index: 0 };

    function kategoriLabel(kategori) {
      return KATEGORI_LABEL[kategori] || kategori || 'Lainnya';
    }

    function thumbnailUrl(fileId, size) {
      return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(fileId) + '&sz=' + (size || 800);
    }

    function previewUrl(fileId) {
      return 'https://drive.google.com/file/d/' + encodeURIComponent(fileId) + '/preview';
    }

    function previewHtml(item, size, extraClass) {
      const isVideo = item.filetype === 'video';
      const isR2 = item.storage_type === 'r2';
      const mediaUrl = safeUrl(item.drive_url);
      const caption = item.keterangan || item.filename || 'Dokumentasi';

      if (isR2) {
        return isVideo
          ? `<video src="${escapeHtml(mediaUrl)}" preload="metadata" muted playsinline class="${extraClass}"></video>`
          : `<img src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(caption)}" loading="lazy" class="${extraClass}">`;
      }

      return `<img src="${escapeHtml(thumbnailUrl(item.file_id, size))}" alt="${escapeHtml(caption)}" loading="lazy" class="${extraClass}">`;
    }

    function albumCover(items) {
      if (items.length <= 1) {
        const item = items[0];
        const isVideo = item.filetype === 'video';
        const overlay = isVideo
          ? '<span class="absolute inset-0 flex items-center justify-center bg-black/25"><span class="w-12 h-12 rounded-full bg-white/90 text-slate-900 flex items-center justify-center text-lg">▶</span></span>'
          : '';
        return `<div class="relative w-full h-full">${previewHtml(item, 800, 'w-full h-full object-cover')}${overlay}</div>`;
      }

      const covers = items.slice(0, 4);
      let cells = covers.map(function (item) {
        const isVideo = item.filetype === 'video';
        const overlay = isVideo
          ? '<span class="absolute inset-0 flex items-center justify-center bg-black/25"><span class="w-8 h-8 rounded-full bg-white/90 text-slate-900 flex items-center justify-center text-xs">▶</span></span>'
          : '';
        return `<div class="relative overflow-hidden bg-slate-800">${previewHtml(item, 400, 'w-full h-full object-cover')}${overlay}</div>`;
      }).join('');

      if (covers.length === 3) cells += '<div class="bg-slate-800"></div>';

      const rows = covers.length === 2 ? '' : ' grid-rows-2';
      return `<div class="grid grid-cols-2${rows} gap-0.5 w-full h-full">${cells}</div>`;
    }

    function albumCardTemplate(album) {
      const items = album.items;
      const first = items[0];
      const isR2 = first.storage_type === 'r2';
      const isVideo = first.filetype === 'video';
      const caption = first.keterangan || first.filename || 'Dokumentasi';
      const mediaUrl = safeUrl(first.drive_url);
      const count = items.length;
      const videoCount = items.filter(function (item) { return item.filetype === 'video'; }).length;
      const photoCount = count - videoCount;
      const countLabel = [
        photoCount ? photoCount + ' foto' : '',
        videoCount ? videoCount + ' video' : ''
      ].filter(Boolean).join(' • ');

      return `
        <article class="group bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col">
          <button type="button" data-album="${escapeHtml(album.id)}" class="relative block w-full aspect-[4/3] bg-slate-800 overflow-hidden text-left">
            ${albumCover(items)}
            <span class="absolute top-2 right-2 text-[10px] font-bold px-2 py-1 rounded-full bg-black/70 text-white">${count} file</span>
          </button>
          <div class="p-3 flex flex-col gap-2 flex-1">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300">${escapeHtml(kategoriLabel(first.kategori))}</span>
              <span class="flex gap-1">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isR2 ? 'bg-amber-500/15 text-amber-300' : 'bg-slate-500/15 text-slate-300'}">${isR2 ? 'R2' : 'DRIVE'}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isVideo ? 'bg-purple-500/15 text-purple-300' : 'bg-sky-500/15 text-sky-300'}">${countLabel || (isVideo ? 'VIDEO' : 'FOTO')}</span>
              </span>
            </div>
            <p class="text-sm font-semibold text-slate-100 line-clamp-2">${escapeHtml(caption)}</p>
            <p class="text-xs text-slate-400">${escapeHtml(first.unit)}</p>
            <div class="mt-auto pt-2 border-t border-slate-800 flex items-center justify-between gap-2 text-[11px] text-slate-500">
              <span class="truncate">${escapeHtml(first.uploader)}</span>
              <span class="shrink-0">${escapeHtml(first.timestamp)}</span>
            </div>
            <div class="flex gap-2 pt-1">
              <button type="button" data-album="${escapeHtml(album.id)}" class="flex-1 text-xs bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold py-1.5 rounded-md">${count > 1 ? 'Lihat Album' : 'Lihat'}</button>
              <a href="${escapeHtml(mediaUrl)}" target="_blank" rel="noopener" class="flex-1 text-center text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded-md">${isR2 ? 'Buka' : 'Drive'}</a>
            </div>
          </div>
        </article>
      `;
    }

    function getFilteredMedia() {
      const unit = document.getElementById('filterUnit').value;
      const kategori = document.getElementById('filterKategori').value;
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      return allMedia.filter(item => {
        if (unit && item.unit !== unit) return false;
        if (kategori && item.kategori !== kategori) return false;
        if (!query) return true;
        return [item.filename, item.keterangan, item.uploader, item.unit, item.kategori]
          .some(value => String(value || '').toLowerCase().includes(query));
      });
    }

    function getAlbums() {
      const filtered = getFilteredMedia();
      const map = new Map();

      filtered.forEach(function (item) {
        const key = item.batch_id || item.id;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      });

      return Array.from(map.entries()).map(function (entry) {
        const items = entry[1].slice().sort(function (a, b) {
          return String(a.timestamp || '').localeCompare(String(b.timestamp || ''));
        });
        return { id: entry[0], items: items };
      });
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const empty = document.getElementById('emptyState');
      const albums = getAlbums();

      if (albums.length === 0) {
        gallery.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      gallery.innerHTML = albums.map(albumCardTemplate).join('');
    }

    function populateFilters() {
      const units = [...new Set(allMedia.map(item => item.unit).filter(Boolean))].sort();
      const kategori = [...new Set(allMedia.map(item => item.kategori).filter(Boolean))].sort();
      const unitSelect = document.getElementById('filterUnit');
      const kategoriSelect = document.getElementById('filterKategori');
      const currentUnit = unitSelect.value;
      const currentKategori = kategoriSelect.value;

      unitSelect.innerHTML = '<option value="">Semua Unit Sekolah</option>' +
        units.map(unit => `<option value="${escapeHtml(unit)}">${escapeHtml(unit)}</option>`).join('');
      kategoriSelect.innerHTML = '<option value="">Semua Kategori</option>' +
        kategori.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(kategoriLabel(item))}</option>`).join('');

      unitSelect.value = currentUnit;
      kategoriSelect.value = currentKategori;
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allMedia.length;
      document.getElementById('statFoto').textContent = allMedia.filter(item => item.filetype !== 'video').length;
      document.getElementById('statVideo').textContent = allMedia.filter(item => item.filetype === 'video').length;
      document.getElementById('statUnit').textContent = new Set(allMedia.map(item => item.unit).filter(Boolean)).size;
    }

    async function loadMedia() {
      const gallery = document.getElementById('gallery');
      const empty = document.getElementById('emptyState');
      empty.classList.add('hidden');
      gallery.innerHTML = '<div class="col-span-full text-center py-16 text-slate-500 text-sm">Memuat galeri...</div>';

      try {
        const result = await apiGet('getMedia');
        if (result.status !== 'success') throw new Error(result.message || 'Gagal memuat data');
        allMedia = Array.isArray(result.data) ? result.data : [];
        updateStats();
        populateFilters();
        renderGallery();
      } catch (err) {
        gallery.innerHTML = '<div class="col-span-full text-center py-16 text-red-400 text-sm">Gagal memuat galeri. Coba refresh beberapa saat lagi.</div>';
      }
    }

    function openAlbum(albumId, index) {
      const album = getAlbums().find(function (entry) { return entry.id === albumId; });
      if (!album || album.items.length === 0) return;

      const safeIndex = Math.max(0, Math.min(index || 0, album.items.length - 1));
      currentAlbum = { id: album.id, items: album.items, index: safeIndex };
      renderLightbox();

      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function renderLightbox() {
      const items = currentAlbum.items;
      if (!items.length) return;

      const index = currentAlbum.index;
      const item = items[index];
      const title = document.getElementById('lightboxTitle');
      const meta = document.getElementById('lightboxMeta');
      const content = document.getElementById('lightboxContent');
      const thumbs = document.getElementById('lightboxThumbs');
      const counter = document.getElementById('lightboxCounter');

      title.textContent = item.keterangan || item.filename || 'Dokumentasi';
      meta.textContent = [item.unit, item.uploader, item.timestamp].filter(Boolean).join(' • ');

      const isR2 = item.storage_type === 'r2';
      const mediaUrl = safeUrl(item.drive_url);

      if (isR2) {
        if (item.filetype === 'video') {
          content.innerHTML = `<video src="${escapeHtml(mediaUrl)}" controls autoplay playsinline class="w-full max-h-[70vh] rounded-lg bg-black"></video>`;
        } else {
          content.innerHTML = `<img src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(title.textContent)}" class="max-w-full max-h-[70vh] object-contain rounded-lg">`;
        }
      } else if (item.filetype === 'video') {
        content.innerHTML = `<iframe src="${escapeHtml(previewUrl(item.file_id))}" class="w-full h-[65vh] rounded-lg bg-black" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      } else {
        content.innerHTML = `<img src="${escapeHtml(thumbnailUrl(item.file_id, 1600))}" alt="${escapeHtml(title.textContent)}" class="max-w-full max-h-[70vh] object-contain rounded-lg">`;
      }

      counter.textContent = items.length > 1 ? `${index + 1} / ${items.length}` : '';
      const prev = document.querySelector('[data-lightbox-prev]');
      const next = document.querySelector('[data-lightbox-next]');
      if (prev) prev.style.visibility = items.length > 1 ? 'visible' : 'hidden';
      if (next) next.style.visibility = items.length > 1 ? 'visible' : 'hidden';

      thumbs.innerHTML = items.map(function (entry, i) {
        const active = i === index ? 'ring-2 ring-emerald-400' : 'opacity-60 hover:opacity-100';
        return `<button type="button" data-thumb="${i}" class="shrink-0 w-16 h-16 rounded-lg overflow-hidden bg-slate-800 ${active}">${previewHtml(entry, 200, 'w-full h-full object-cover')}</button>`;
      }).join('');
    }

    function moveLightbox(step) {
      if (currentAlbum.items.length < 2) return;
      const total = currentAlbum.items.length;
      currentAlbum.index = (currentAlbum.index + step + total) % total;
      renderLightbox();
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.classList.add('hidden');
      document.getElementById('lightboxContent').innerHTML = '';
      document.getElementById('lightboxThumbs').innerHTML = '';
      document.body.style.overflow = '';
      currentAlbum = { id: '', items: [], index: 0 };
    }

    document.getElementById('gallery').addEventListener('click', function (event) {
      const trigger = event.target.closest('[data-album]');
      if (trigger) openAlbum(trigger.getAttribute('data-album'), 0);
    });

    document.getElementById('lightbox').addEventListener('click', function (event) {
      if (event.target === this || event.target.closest('[data-close-lightbox]')) {
        closeLightbox();
        return;
      }

      const thumb = event.target.closest('[data-thumb]');
      if (thumb) {
        currentAlbum.index = parseInt(thumb.getAttribute('data-thumb'), 10) || 0;
        renderLightbox();
        return;
      }

      if (event.target.closest('[data-lightbox-prev]')) moveLightbox(-1);
      if (event.target.closest('[data-lightbox-next]')) moveLightbox(1);
    });

    document.addEventListener('keydown', function (event) {
      const lightbox = document.getElementById('lightbox');
      if (lightbox.classList.contains('hidden')) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') moveLightbox(-1);
      if (event.key === 'ArrowRight') moveLightbox(1);
    });

    ['filterUnit', 'filterKategori'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', renderGallery);
    });
    document.getElementById('searchInput').addEventListener('input', renderGallery);

    const session = getStoredUser();
    if (session && getStoredToken()) {
      const link = document.getElementById('sessionLink');
      link.textContent = 'Dashboard';
      link.href = session.role === 'admin' ? 'admin.html' : 'media.html';
    }

    loadSiteConfig().then(function (cfg) {
      const name = cfg.EVENT_NAME || 'PERSAWI 2026';
      document.getElementById('eventName').textContent = 'Galeri ' + name;
      document.getElementById('eventSubtitle').textContent = cfg.EVENT_SUBTITLE || '';
      document.getElementById('eventSlogan').textContent = cfg.EVENT_SLOGAN || '';
      document.getElementById('footerEvent').textContent = name;
      document.title = 'Galeri Publik - ' + name;
    });

    loadMedia();
  </script>
</body>
</html>
